# Structural checks — drift alarm for pushed commits.
# scripts/release-gate.sh remains the packaging authority. The central fixture
# registry is the behavioral-test authority in local, CI, and release contexts;
# CI runs it without rewriting committed evidence on both Linux and Windows.
# Introduced by docs/analysis/2026-07-06_systematic-improvement-plan.md WS-5;
# expanded by docs/analysis/2026-07-07_full-links-coherence-audit.md.

name: structural-checks

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml tiktoken==0.12.0 jsonschema
      - name: Structural + registry checks
        run: |
          set -e
          for script in \
            skill-check.py \
            schema_runtime_check.py \
            version-check.py \
            distribution-rights-check.py \
            catalog-check.py \
            path-hygiene-check.py \
            snippet-check.py \
            output_economy_check.py \
            version-planes-check.py \
            commitment-interactions-check.py \
            phase_engagement_check.py \
            retirement-sweep-check.py \
            command_surface_check.py \
            destination-coverage-check.py
          do
            echo "::group::$script"
            python scripts/"$script"
            echo "::endgroup::"
          done
      - name: Coherence checks
        run: |
          set -e
          for script in \
            grounding_anchors_check.py \
            contract-kernel-check.py \
            manifest_links_check.py \
            manifest-coherence-check.py \
            ssot-check.py
          do
            echo "::group::$script"
            python scripts/"$script"
            echo "::endgroup::"
          done
      - name: Predicate census parity
        run: |
          python scripts/analysis/code_census.py \
            --parity docs/analysis/generated/predicate_rows.md

  # The registry's documented environment is a checkout inside a governed
  # workspace (<workspace>/platform/co-author-harness, beside the routing
  # manifest) with a qualified pdftotext on PATH. The job recreates that as a
  # sandbox. Cases whose declared workspace preconditions (the sibling
  # knowledge wiki) are absent, or that declare the hosted runner unable to
  # run them, report UNAVAILABLE, never PASS; the release gate on the
  # author's workspace still requires them.
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ws/platform/co-author-harness
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/platform/co-author-harness
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml tiktoken==0.12.0 jsonschema
      - name: Governed sandbox workspace
        shell: bash
        run: |
          mkdir -p ../../governance/output-routing
          printf 'schema_version: 1\nworkspace_kind: ci-sandbox\nroutes: []\n' \
            > ../../governance/output-routing/output_routing.yaml
      - name: Git identity for suites that commit in scratch repositories
        run: |
          git config --global user.name "structural-checks"
          git config --global user.email "structural-checks@users.noreply.github.com"
      # The hosted Windows TEMP is an 8.3 alias (C:\Users\RUNNER~1\...), and
      # several resolvers compare resolved long paths with unresolved short
      # ones. Use the runner's long-path temp directory, as on the author's
      # host; the alias defect itself is recorded in CHANGELOG.md.
      - name: Long-path temp directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
      - name: Poppler pdftotext (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v
      - name: Poppler pdftotext (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "poppler-24.02.0.zip"
          Invoke-WebRequest "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.02.0-0/Release-24.02.0-0.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "f6f01582484b0587096955adcb4b8881bcf7ff27ad62fc4809c23e20810fb7cc") { throw "poppler archive hash mismatch: $hash" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP "poppler-24.02.0\Library\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin "pdftotext.exe") -v
      - name: Fixture infrastructure preflight
        run: python scripts/analysis/fixture_infrastructure_check.py
      - name: Authoritative fixture registry
        run: python scripts/analysis/fixture_runner.py --no-write --allow-unavailable
