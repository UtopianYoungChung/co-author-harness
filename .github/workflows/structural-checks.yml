# Structural checks — drift alarm for pushed commits.
# scripts/release-gate.sh remains the packaging authority. The central fixture
# registry is the behavioral-test authority in local, CI, and release contexts;
# CI runs it without rewriting committed evidence on both Linux and Windows.
# Introduced by docs/analysis/2026-07-06_systematic-improvement-plan.md WS-5;
# expanded by docs/analysis/2026-07-07_full-links-coherence-audit.md.

name: structural-checks

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml tiktoken jsonschema
      - name: Structural + registry checks
        run: |
          set -e
          for script in \
            skill-check.py \
            schema_runtime_check.py \
            version-check.py \
            distribution-rights-check.py \
            catalog-check.py \
            path-hygiene-check.py \
            snippet-check.py \
            output_economy_check.py \
            version-planes-check.py \
            commitment-interactions-check.py \
            retirement-sweep-check.py
          do
            echo "::group::$script"
            python scripts/"$script"
            echo "::endgroup::"
          done
      - name: Coherence checks
        run: |
          set -e
          for script in \
            grounding_anchors_check.py \
            manifest_links_check.py \
            manifest-coherence-check.py \
            ssot-check.py
          do
            echo "::group::$script"
            python scripts/"$script"
            echo "::endgroup::"
          done
      - name: Predicate census parity
        run: |
          python scripts/analysis/code_census.py \
            --parity docs/analysis/generated/predicate_rows.md

  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml tiktoken jsonschema
      - name: Fixture infrastructure preflight
        run: python scripts/analysis/fixture_infrastructure_check.py
      - name: Authoritative fixture registry
        run: python scripts/analysis/fixture_runner.py --no-write
