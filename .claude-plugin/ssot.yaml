# co-author-harness — Single Source of Truth (SSOT) Registry
#
# Authored at v0.11.0 c9 per the definitive-architectural-plan §3.4.
#
# Purpose. The SSOT registry names a small set of facts the plugin
# repeats across multiple files (skill counts, command counts, the
# manifest version, the user-facing description) and declares for each
# fact the **authority** (the file or computation that produces the
# canonical value) and the **consumers** (files that must agree with
# the authority).
#
# scripts/ssot-check.py reads this registry and verifies that each
# consumer either:
#   (a) carries the exact authoritative value, OR
#   (b) explicitly declares the value as "<derived>" / absent (the
#       c2.6 catalog-check posture: README does not assert a count;
#       the validator surfaces "<missing>" rather than blocking).
#
# Adding a new fact: declare its `authority` (a file path with a
# resolution method, or a directive token like `<count:skills/*/SKILL.md>`)
# and its `consumers` (paths + extraction patterns). ssot-check.py reads
# this file at validate-time; no plugin code reads from it at runtime.
#
# Forensic amendment (v0.11.0 §2.2): both manifest descriptions
# (.claude-plugin/plugin.json and .claude-plugin/marketplace.json self-
# referencing entry) are registered as `skill_count` consumers with
# resolution method `none` — they MUST NOT assert any count, full stop.
# manifest-coherence-check.py enforces the asserted-count BLOCKER on
# both surfaces; this registry is the authoritative documentation of
# that posture.

facts:

  # ---------------------------------------------------------------
  # Fact: skill_count
  # ---------------------------------------------------------------
  skill_count:
    description: |
      Number of shipped skills. The filesystem is authoritative — count
      directories matching `skills/*/SKILL.md` at validate-time. No prose
      surface should assert this number; counts in prose drift the moment
      a skill is added or removed.
    authority:
      method: count
      pattern: "skills/*/SKILL.md"
    consumers:
      - path: README.md
        method: none
        rationale: |
          c2.6 catalog-check inverts the contract — README emits the
          heading "### Skill catalog" without asserting a count. The
          validator surfaces "<missing>" (healthy) rather than blocking.
      - path: .claude-plugin/plugin.json
        method: none
        rationale: |
          c2.5 dropped "Ships 32 skills" from plugin.json description.
          manifest-coherence-check.py BLOCKERs any re-introduced
          asserted count.
      - path: .claude-plugin/marketplace.json
        method: none
        rationale: |
          Same posture as plugin.json — c2.5 unified the two
          descriptions; both must omit hardcoded counts.

  # ---------------------------------------------------------------
  # Fact: command_count
  # ---------------------------------------------------------------
  command_count:
    description: |
      Number of shipped slash commands. Authority is the count of
      `commands/*.md` files at validate-time. The plugin-commands SKILL
      lists each command in a table — that table is the user-facing
      catalog and is allowed to enumerate; it is NOT allowed to assert
      a top-line count separately.
    authority:
      method: count
      pattern: "commands/*.md"
    consumers:
      - path: .claude-plugin/plugin.json
        method: none
        rationale: |
          Same posture as skill_count: no asserted-count claims in
          manifest descriptions.

  # ---------------------------------------------------------------
  # Fact: manifest_version
  # ---------------------------------------------------------------
  manifest_version:
    description: |
      Authoritative plugin version. version-check.py enforces parity
      across plugin.json, marketplace.json self-referencing entries,
      README.md "## Version" section, and CHANGELOG.md top heading.
    authority:
      method: json_field
      path: .claude-plugin/plugin.json
      field: version
    consumers:
      - path: .claude-plugin/marketplace.json
        method: json_field
        field: plugins[*].version  # for self-referencing entries only
      - path: README.md
        method: regex
        pattern: '^##\s+Version\s+`(\d+\.\d+\.\d+)`'
      - path: CHANGELOG.md
        method: regex
        pattern: '^##\s+v(\d+\.\d+\.\d+)\s'  # first non-(unreleased)

  # ---------------------------------------------------------------
  # Fact: manifest_description
  # ---------------------------------------------------------------
  manifest_description:
    description: |
      User-facing plugin description (the tagline that surfaces in the
      Cowork plugin picker and the marketplace listing). Both manifest
      forms must carry the same string; description parity is enforced
      by manifest-coherence-check.py Check 5.
    authority:
      method: json_field
      path: .claude-plugin/plugin.json
      field: description
    consumers:
      - path: .claude-plugin/marketplace.json
        method: json_field
        field: plugins[*].description  # for self-referencing entries only
