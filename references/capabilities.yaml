schema_version: 2.0.0
authority: references/capabilities.yaml
capability_planes: [policy, contract, producer, consumer, runtime, evidence]
status_contract:
  active: callable through the declared entrypoint with behavioral evidence
  degraded: callable, but behavioral assurance or integration is incomplete
  external-dependent: callable only when the named external provider is available
  unavailable: intentionally not callable; the reason code must be surfaced
execution_modes:
  - prompt-mediated
  - script-backed
  - orchestration
  - catalog-only
  - deferred
exposures:
  - public
  - compatibility
  - internal

closure_profiles:
  prompt-degraded:
    behavior_status: degraded
    missing_planes: [evidence]
    planes:
      policy: {entrypoint: "skills/{capability}/SKILL.md"}
      contract: {kernel_component: agent-contracts}
      producer: {kind: prompt-mediated, entrypoint_from_policy: true}
      consumer: {profile: human-governed-consumer}
      runtime: {members: ["skills/{capability}/SKILL.md"], probe_ids: [scripts/skill-check.py]}
      evidence: {status: partial, fixture_paths_from_row: true}
  prompt-external:
    behavior_status: external-dependent
    missing_planes: [consumer]
    planes:
      policy: {entrypoint: "skills/{capability}/SKILL.md"}
      contract: {kernel_component: agent-contracts}
      producer: {kind: prompt-mediated, entrypoint_from_policy: true}
      consumer: {profile: external-provider-from-row}
      runtime: {members: ["skills/{capability}/SKILL.md"], probe_ids: [scripts/skill-check.py]}
      evidence: {status: provider-dependent, fixture_paths_from_row: true}
  deferred-unavailable:
    behavior_status: unavailable
    missing_planes: [producer, consumer, runtime]
    planes:
      policy: {entrypoint: "skills/{capability}/SKILL.md"}
      contract: {kernel_component: agent-contracts}
      producer: {status: unavailable}
      consumer: {status: unavailable}
      runtime: {status: unavailable, members: ["skills/{capability}/SKILL.md"], probe_ids: [scripts/skill-check.py]}
      evidence: {status: refusal-only, fixture_paths_from_row: true}
  script-active:
    behavior_status: active
    missing_planes: []
    planes:
      policy: {entrypoint: "skills/{capability}/SKILL.md"}
      contract: {kernel_component: agent-contracts}
      producer: {kind: script-backed, implementation_from_row: true}
      consumer: {profile: local-callable-consumer}
      runtime: {members_from_policy_and_implementation: true, probe_ids_from_evidence: true}
      evidence: {status: registered, fixture_paths_from_row: true}
  orchestration-active:
    behavior_status: active
    missing_planes: []
    planes:
      policy: {entrypoint: "skills/{capability}/SKILL.md"}
      contract: {kernel_component: agent-contracts}
      producer: {kind: orchestration, implementation_from_row: true}
      consumer: {profile: local-callable-consumer}
      runtime: {members_from_policy_and_implementation: true, probe_ids_from_evidence: true}
      evidence: {status: registered, fixture_paths_from_row: true}
  orchestration-degraded:
    behavior_status: degraded
    missing_planes: [consumer]
    planes:
      policy: {entrypoint: "skills/{capability}/SKILL.md"}
      contract: {kernel_component: agent-contracts}
      producer: {kind: orchestration, entrypoint_from_policy: true}
      consumer: {profile: independently-governed-consumer, status: pending}
      runtime: {members: ["skills/{capability}/SKILL.md"], probe_ids_from_evidence: true}
      evidence: {status: partial, fixture_paths_from_row: true}
  catalog-degraded:
    behavior_status: degraded
    missing_planes: [producer]
    planes:
      policy: {entrypoint: "skills/{capability}/SKILL.md"}
      contract: {kernel_component: agent-contracts}
      producer: {kind: catalog-only, status: descriptive}
      consumer: {profile: catalog-reader}
      runtime: {members: ["skills/{capability}/SKILL.md"], probe_ids_from_evidence: true}
      evidence: {status: partial, fixture_paths_from_row: true}

