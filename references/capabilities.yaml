schema_version: 1.0.0
authority: references/capabilities.yaml
status_contract:
  active: callable through the declared entrypoint with behavioral evidence
  degraded: callable, but behavioral assurance or integration is incomplete
  external-dependent: callable only when the named external provider is available
  unavailable: intentionally not callable; the reason code must be surfaced
execution_modes:
  - prompt-mediated
  - script-backed
  - orchestration
  - catalog-only
  - deferred
exposures:
  - public
  - compatibility
  - internal

# This registry describes the current checkout. Target architecture diagrams do
# not promote a capability; only a deliberate registry edit plus evidence can.
